name: Update GuruFocus Insider Ratio

on:
  schedule:
    # UTC 時間;每天 02:00 UTC = 台灣 10:00
    - cron: "0 2 * * *"
  workflow_dispatch:   # 可在 Actions 頁面手動執行

permissions:
  contents: write      # 允許 workflow 把更新後的 CSV commit 回 repo

concurrency:
  group: update-insider
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Install browser (Playwright Chromium + xvfb)
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          python -m playwright install --with-deps chromium

      - name: Fetch latest ratio
        env:
          GURUFOCUS_COOKIE: ${{ secrets.GURUFOCUS_COOKIE }}   # 沒有就不用設定
        run: xvfb-run -a python fetch_insider_ratio.py

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain -- '*.csv')" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- '*.csv'
            git commit -m "chore: update insider buy/sell ratio $(date -u +%F)"
            git push
          else
            echo "No changes."
          fi
