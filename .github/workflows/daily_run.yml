
name: Daily Finance Monitor

# 避免同一個 workflow 同時執行多次
concurrency:
  group: daily-finance-monitor
  cancel-in-progress: false

# 設定觸發時機
on:
  schedule:
    # 每天 UTC 21:30（台灣時間隔天 05:30）
    - cron: '30 21 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # 允許 Actions 推送更新回 repository
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Monitor Script
      env:
        FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      run: |
        echo "Run 1: run monitor_lite.py..."
        python monitor_lite.py

    - name: Commit and Push JSON
      run: |
        git config user.name "GitHub Action"
        git config user.email "action@github.com"

        git add vip_data.json

        # 如果沒有資料變動，就正常結束
        git diff --cached --quiet && exit 0

        git commit -m "Update vip_data.json"

        # 整合遠端最新提交，再推送
        git pull --rebase origin main
        git push origin main
